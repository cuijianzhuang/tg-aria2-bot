<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频共享账号</title><link rel="stylesheet" href="/style.css">
<main style="max-width:800px;margin:40px auto;padding:24px"><h1>🔑 视频平台共享账号</h1><p>仅管理员可管理共享账号。个人账号请从机器人私聊生成专属链接。扫码成功后需单独开放共享。</p><p id="message"></p><div id="accounts"></div><a href="/">⬅ 返回后台</a></main>
<script>
async function api(path,body){const r=await fetch('/api/video/accounts'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function action(name,platform,extra={}){try{const d=await api('/'+name,{platform,...extra});if(d.url)location.href=d.url;else load()}catch(e){document.querySelector('#message').textContent=e.message}}
async function load(){try{const rows=await api('');const root=document.querySelector('#accounts');root.replaceChildren();for(const row of rows){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=row.platform;const p=document.createElement('p');p.textContent=(row.identity||'未登录')+' · '+(row.shared?'共享已开放':'共享未开放');section.append(h,p);for(const [text,name,extra]of [['📱 扫码登录','login',{}],['✅ 开放共享','sharing',{enabled:true}],['⛔ 关闭共享','sharing',{enabled:false}],['🗑 移除本机登录','remove',{}]]){const b=document.createElement('button');b.textContent=text;b.onclick=()=>action(name,row.platform,extra);section.append(b)}root.append(section)}}catch(e){document.querySelector('#message').textContent=e.message+'；请先返回后台登录。'}}load();
</script></html>
