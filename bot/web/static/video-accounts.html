<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>已保存的视频账号</title>
<style>
body{font:16px system-ui;margin:0;background:#101827;color:#e5eaf3}main{max-width:900px;margin:40px auto;padding:24px}a{color:#94bfff}p{line-height:1.7;color:#b5c5dc}#accounts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:24px 0}section{background:#1b273b;padding:22px;border-radius:16px}button{font:inherit;border:0;border-radius:8px;padding:10px 13px;margin:5px 5px 5px 0;cursor:pointer;background:#3478dc;color:white}button.secondary{background:#34445e}button.danger{background:#9b384a}button:disabled{opacity:.5;cursor:wait}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#34445e}.open{background:#20654c}h2{margin-top:0}#message{min-height:24px}
</style>
<main><h1>🔑 已保存的视频账号</h1><p>这里管理管理员共享账号。个人账号请在机器人私聊使用 /videoaccounts 查看和管理。已保存登录态不代表当前仍有效，解析/下载时会校验。</p><button id="refresh" class="secondary">🔄 刷新列表</button><p id="message" role="status"></p><div id="accounts"></div><a href="/">⬅ 返回后台</a></main>
<script>
async function api(path,body){const r=await fetch('/api/video/accounts'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function action(name,platform,extra={},button){if(name==='remove'&&!confirm('移除本机保存的共享登录状态？正在执行的下载仍使用已有临时快照。'))return;button.disabled=true;try{const d=await api('/'+name,{platform,...extra});if(d.url)location.href=d.url;else await load()}catch(e){document.querySelector('#message').textContent=e.message}finally{button.disabled=false}}
function paragraph(text){const p=document.createElement('p');p.textContent=text;return p}
async function load(){try{const rows=await api('');const root=document.querySelector('#accounts');root.replaceChildren();for(const row of rows){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=row.label||row.platform;const badge=document.createElement('span');badge.className='badge'+(row.shared?' open':'');badge.textContent=row.saved?(row.shared?'已保存 · 共享已开放':'已保存 · 共享未开放'):'未登录';section.append(h,badge);section.append(paragraph('账号：'+(row.identity||(row.source==='file'?'管理员配置的 Cookie 文件':'—'))));section.append(paragraph('最近登录：'+(row.updated?new Date(row.updated*1000).toLocaleString():'—')));const actions=[[row.saved?'📱 重新扫码':'📱 扫码登录','login',{}]];if(row.saved)actions.push([row.shared?'⛔ 关闭共享':'✅ 开放共享','sharing',{enabled:!row.shared}]);if(row.source==='scan')actions.push(['🗑 移除登录','remove',{}]);for(const [text,name,extra]of actions){const b=document.createElement('button');b.textContent=text;b.className=name==='remove'?'danger':name==='sharing'?'secondary':'';b.onclick=()=>action(name,row.platform,extra,b);section.append(b)}root.append(section)}document.querySelector('#message').textContent='列表已更新：'+new Date().toLocaleTimeString()}catch(e){document.querySelector('#message').textContent=e.message+'；请确认已在管理后台登录。'}}document.querySelector('#refresh').onclick=load;load();setInterval(load,30000);
</script></html>
