name: Tests

on:
  push:
    # master 的 push 由 deploy.yml 通过 workflow_call 复用本 workflow 跑测试，
    # 这里排除掉，避免同一个提交跑两遍
    branches-ignore: [master]
  pull_request: {}
  workflow_call: {}

env:
  # bot.config.Settings requires these at import time; dummies are fine for tests
  BOT_TOKEN: test-token
  API_ID: "1"
  API_HASH: test-hash
  ARIA2_SECRET: test-secret

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11：bare 模式支持的最低版本（pyproject target-version）；
        # 3.14：docker 镜像（Dockerfile）实际运行的版本
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-video.txt
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - name: Ruff annotations (public modules)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select ANN"
          src: >-
            bot/core/sources.py
            bot/core/download_service.py
            bot/video/backends.py
      - name: Ruff formatting (adopted modules)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: >-
            bot/core/sources.py
            bot/core/download_service.py
            tests/test_sources.py
            tests/test_download_service.py
            tests/test_architecture.py
            bot/video
            bot/db/video.py
            bot/handlers/video.py
            bot/handlers/video_tasks.py
            bot/web/video.py
            tests/test_video.py
            tests/test_video_web.py
            tests/test_video_worker.py
            tests/test_video_accounts.py
            bot/handlers/menu.py
            tests/test_menu_navigation.py
      - run: python -m compileall -q bot
      - run: python -c 'import bot.main, bot.web.app'
      - run: python -m unittest discover tests -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -S warning tg-aria2.sh install.sh update.sh deploy.sh scripts/deploy-images.sh
