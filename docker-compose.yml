# 日志轮转：docker 默认的 json-file 驱动不限大小，长期运行会把磁盘吃满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - botapi-data:/var/lib/telegram-bot-api
    logging: *default-logging
    networks: [internal]

  aria2:
    image: p3terx/aria2-pro:latest
    restart: unless-stopped
    environment:
      RPC_SECRET: ${ARIA2_SECRET}
      RPC_PORT: 6800
      UPDATE_TRACKERS: "true"
      PUID: 1000
      PGID: 1000
    volumes:
      - ${HOST_DOWNLOAD_DIR:-./downloads}:/downloads
      - ./aria2-config:/config
    # No host port published: bot/web reach this over the internal docker network
    # (aria2:6800), and ariang proxies /jsonrpc to it server-side (see
    # ariang-nginx.conf) instead of the browser hitting this port directly.
    # (A public 6800 mapping was staged here pending explicit user confirmation
    # that was never actually given in those exact terms — reverted rather than
    # left live on an unconfirmed risk.)
    logging:
      driver: json-file
      options:
        max-size: "1m"
    networks: [internal]

  bot:
    build: .
    restart: unless-stopped
    # 不用 env_file：配置统一从挂载进来的 /app/.env 读取（pydantic-settings）。
    # env_file 会在创建容器时把 .env 冻结成环境变量，而环境变量优先级高于
    # .env 文件——设置菜单写回 .env 的开关在 docker compose restart 后会被
    # 创建时的旧值盖掉、悄悄还原。只走文件，restart 就能拿到最新配置。
    depends_on: [telegram-bot-api, aria2]
    volumes:
      - ${HOST_DOWNLOAD_DIR:-./downloads}:/downloads
      - ./data:/app/data
      # settings edited at runtime (gofile toggles) are written back to .env;
      # mount the host file so those writes survive restarts and are visible
      # to the web container too (env_file alone only injects at start)
      - ./.env:/app/.env
    logging: *default-logging
    networks: [internal]

  web:
    build: .
    command: ["python", "-m", "uvicorn", "bot.web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    # 同 bot：只从挂载的 /app/.env 读配置，不用 env_file
    depends_on: [aria2]
    ports:
      # Exposed publicly at the user's request. Mitigations in place: HTTPOnly signed
      # session cookie (bot/web/auth.py) + per-IP login rate limiting (bot/web/app.py,
      # 5 attempts / 5 min then a 5 min lockout). Still plain HTTP — no TLS — so treat
      # ADMIN_PASSWORD as sent in the clear on every login.
      # 在 .env 里设 WEB_BIND=127.0.0.1 可改成只监听本机（配合 SSH 隧道/反向代理）。
      - "${WEB_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ./data:/app/data
      - ./aria2-config:/aria2-config
      # web writes ADMIN_PASSWORD / GOFILE_* here — without this mount those
      # writes landed on the container's own filesystem and vanished on restart
      - ./.env:/app/.env
    logging: *default-logging
    networks: [internal]
    profiles: ["web"]

  ariang:
    build:
      context: .
      dockerfile: Dockerfile.ariang
    restart: unless-stopped
    depends_on: [aria2]
    ports:
      # Exposed publicly at the user's request, same posture as `web` above. Only
      # this port needs to be public — aria2's RPC port itself stays internal-only,
      # nginx proxies /jsonrpc to it server-side.
      - "${WEB_BIND:-0.0.0.0}:6880:80"
    logging: *default-logging
    networks: [internal]
    profiles: ["web"]

networks:
  internal:

volumes:
  botapi-data:
